<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="barTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with subtle ring border -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#334155" stroke-width="1" />
  
  <!-- Financial Bars -->
  <!-- Bar 1 (Plan) -->
  <rect x="6" y="14" width="4.5" height="11" rx="1.5" fill="url(#barBlue)" />
  <!-- Bar 2 (Actual - Favorable) -->
  <rect x="12" y="9" width="4.5" height="16" rx="1.5" fill="url(#barTeal)" />
  <!-- Bar 3 (Plan Target 2) -->
  <rect x="18" y="16" width="4.5" height="9" rx="1.5" fill="url(#barBlue)" />
  <!-- Bar 4 (Actual 2) -->
  <rect x="24" y="11" width="4.5" height="14" rx="1.5" fill="url(#barTeal)" />
</svg>
